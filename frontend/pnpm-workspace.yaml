packages:
  - 'packages/*/*'
allowBuilds:
  # The desktop app's runtime (packages/apps/desktop). The version pinned has
  # no install script and fetches its binary the first time it is run; one
  # that fetches it at install again is allowed to. CI's jobs (ci.yml) never
  # run Electron, and set ELECTRON_SKIP_BINARY_DOWNLOAD for that download; the
  # Bundle workflow (bundle.yml), which packages it, does not.
  electron: true
  # electron-builder's dependency for Windows installers, which nothing here
  # builds: its install script is not run.
  electron-winstaller: false
  esbuild: true

# An advisory `pnpm audit` (`make audit`, and the `Audit` step of CI's
# `frontend` job) should let pass is listed under `auditConfig.ignoreGhsas`, by
# its GHSA id, and only when no release clears it or the release that does is a
# major that cannot be adopted yet. Each id carries a comment naming the input
# path and the mode it would need (say, "needs Vitest's UI server listening")
# and why that does not hold here. There are none today.

# global-agent 3, which the Electron download inside electron-builder asks for
# (and calls only behind a proxy, ELECTRON_GET_USE_PROXY), carries roarr 2 and
# through it sprintf-js 1.1.3 (GHSA-hp3w-g68c-fv3c), which no release of
# sprintf-js clears. global-agent 4 keeps the `bootstrap` it calls and drops
# roarr.
overrides:
  global-agent: 4.1.3
