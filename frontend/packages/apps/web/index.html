<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>coffret</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-dark.png" media="(prefers-color-scheme: dark)" />
    <style>
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        /* COLOR.ground and COLOR.text of src/theme.ts, and its FONT. */
        background: #f7f8fa;
        color: #16181d;
        font-family: Inter, system-ui, sans-serif;
        font-size: 14px;
      }

      /* The hover states of the explorer, in COLOR.hover of src/theme.ts. Here
         rather than inline because a hover is a state of the element and not a
         property of it: writing it in React means holding it, and a row that
         holds its own hover is a row that re-renders on the way past. A row
         drawn in a colour of its own — focused, selected, under a drop — keeps
         it, its inline background winning over this. */
      tr.row.activatable {
        cursor: pointer;
      }
      tr.row.activatable:hover {
        background: #eef1f5;
      }

      /* A row's "⋮" shows on the row under the pointer and on the focused
         row, and stays while the menu it opened is open. */
      tr.row .row-actions {
        visibility: hidden;
      }
      tr.row:hover .row-actions,
      tr.row[data-focused] .row-actions,
      tr.row .row-actions[aria-expanded='true'] {
        visibility: visible;
      }
      tr.row .row-actions:hover {
        background: #eef1f5;
      }
      /* On the focused row's accent, a darker shade of it (COLOR.accentDeep):
         the light hover would put the white mark on white. */
      tr.row[data-focused][aria-selected='true'] .row-actions:hover {
        background: #1d4ed8;
      }

      /* The details pane gives its width back to the tree on a narrow
         window: the tree is the screen, and the pane only says more about a
         row of it. A width and nothing to hold, so here rather than inline. */
      @media (max-width: 760px) {
        aside.details {
          display: none;
        }
      }

      /* The reader's sheet slides in from the right as it opens. An
         entrance and nothing to hold, so here rather than inline. */
      section.sheet {
        animation: sheet-in 160ms ease-out;
      }
      @keyframes sheet-in {
        from {
          transform: translateX(32px);
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        section.sheet {
          animation: none;
        }
      }

      /* A field's placeholder, in COLOR.faint of src/theme.ts: set here
         because no inline style reaches a pseudo-element. The opacity undoes
         the dimming some browsers lay over the colour on their own. */
      input::placeholder,
      textarea::placeholder {
        color: #8a919c;
        opacity: 1;
      }

      code {
        font-family: ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
