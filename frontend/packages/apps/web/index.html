<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>coffret</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        background: #111;
        color: #eee;
        font-family: system-ui, sans-serif;
      }

      /* The hover states of the explorer. Here rather than inline because a
         hover is a state of the element and not a property of it: writing it
         in React means holding it, and a row that holds its own hover is a row
         that re-renders on the way past. */
      tr.row.activatable {
        cursor: pointer;
      }
      tr.row.activatable:hover {
        background: #222;
      }
      button.tree-name:hover {
        background: #222;
      }

      code {
        font-family: ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
