[workspace]
resolver = "2"
members = ["crates/*/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/x7c1/coffret"

[workspace.dependencies]
# Internal crates
coffret-cli = { path = "crates/apps/coffret-cli" }
coffret-device = { path = "crates/apps/coffret-device" }
coffret-format = { path = "crates/domain/coffret-format" }
coffret-interop = { path = "crates/apps/coffret-interop" }
coffret-logging = { path = "crates/libs/coffret-logging" }
coffret-model = { path = "crates/domain/coffret-model" }
coffret-server = { path = "crates/apps/coffret-server" }
coffret-shell = { path = "crates/apps/coffret-shell" }
coffret-sqlite-index = { path = "crates/gateway/coffret-sqlite-index" }
coffret-usecase = { path = "crates/domain/coffret-usecase" }
google-drive-store = { path = "crates/gateway/google-drive-store" }
s3-store = { path = "crates/gateway/s3-store" }

# Shared third-party dependencies
anyhow = "1"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
async-trait = "0.1"
# The SDK's own credential and region resolution — environment, then profile —
# which is what lets a device settings file say where an S3 Library is without
# ever holding the credentials to reach it.
aws-config = { version = "1", features = ["behavior-version-latest"] }
# The SDK's own default set, minus `rustls`. That feature does not mean "use
# TLS" — it selects the SDK's *legacy* connector, hyper 0.14 over rustls 0.21,
# and drags rustls-webpki 0.101 and h2 0.3 in with it, both of which carry an
# open advisory that is fixed only on a later line. What actually reaches
# Storage is `default-https-client`: hyper 1 over rustls 0.23 with aws-lc,
# which the workspace already builds. `test-util` is the same trap under
# another name: it turns on `aws-smithy-runtime/legacy-test-util`, which is
# that connector again — take the test clients from the crate below.
aws-sdk-s3 = { version = "1", default-features = false, features = [
  "default-https-client",
  "http-1x",
  "rt-tokio",
  "sigv4a",
] }
# The fake clients the S3 gateway's cases answer from, taken from the crate that
# owns them. `aws_smithy_runtime::client::http::test_util` re-exports the same
# names, but it is deprecated and its feature reaches them through the legacy
# hyper 0.14 stack — which would put back in the test build exactly what the
# dependency above took out of the shipping one.
aws-smithy-http-client = { version = "1", features = ["test-util"] }
aws-smithy-runtime-api = "1"
aws-smithy-types = { version = "1", features = ["http-body-1-x"] }
# `multipart` is not on by default. It is the one body shape the explorer sends
# rather than receives — files dropped onto a folder — and it is read as a stream
# of parts, so nothing about having it holds a request in memory.
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
# BIP-350 Bech32m, the encoding a Recovery Code is one string of (spec: KD-11).
bech32 = "0.12"
blake3 = "1"
bytes = "1"
chacha20poly1305 = "0.11"
ciborium = "0.2"
# `env` for the one parameter that has a value worth setting once for a machine
# rather than per run: how long a served Library stays unlocked (spec: DK-4).
clap = { version = "4", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false }
getrandom = "0.4"
hkdf = "0.13"
http-body = "1"
# JPEG alone: the fixture generator encodes camera- and page-sized JPEGs and
# reads nothing back. The default set adds every codec the crate has, and the
# AVIF and EXR encoders among them bring their own dependency trees (rav1e,
# pulp, and the unmaintained `paste`) for formats nothing here writes. The
# `rayon` default goes with them, and takes nothing: with those two encoders
# off it only adds an image-level parallel API the generator never calls —
# it runs its own rayon across files instead.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
md-5 = "0.11"
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "stream",
] }
# Reading a Passphrase from a terminal without echoing it, which no part of the
# standard library does.
rpassword = "7"
# `bundled` compiles SQLite itself into the binary, so an Index file means the
# same thing on every machine rather than whatever the host's libsqlite3 is.
rusqlite = { version = "0.32", features = ["bundled"] }
# The `*at` syscalls a write into a mapped root is confined with (spec: EP-4,
# EP-11). The standard library offers none of them — only path-based calls, which
# are precisely the ones that follow links — and the domain crate forbids
# `unsafe`, so `libc` cannot be called directly there. `statvfs` is the other
# one, in the explorer's server: how much room is left on the volume a drop is
# landing on, which the standard library has no way to ask and which that crate
# cannot ask directly for the same reason. `fs` alone: this is a handful of
# syscalls, not a second standard library.
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
time = { version = "0.3", default-features = false, features = [
  "formatting",
  "parsing",
  "std",
] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
# `ServiceExt::oneshot`, so a router can be driven as the service it is rather
# than through a socket. Test support: nothing that ships reaches for it.
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "ansi",
  "fmt",
  # The log file is JSONL: an event's fields are what the file is read for, and
  # only this feature carries the formatter that keeps them as fields.
  "json",
  "std",
] }
unicode-normalization = "0.1"
url = "2"
# Overwriting a buffer that held key material, in a way the compiler may not
# elide (spec: DK-7). Nothing in the standard library does that — a plain write
# to a value about to be dropped is dead code an optimizer is free to remove —
# so this is what every secret-bearing type here wipes itself with. Default
# features only: `alloc` is what the `Vec` and `String` implementations need,
# and the derive macro is deliberately left off — `coffret-model`'s dependency
# list is asserted by `make deps`, and a proc macro would put four more crates
# in it to save four lines of `Drop`.
zeroize = "1"
