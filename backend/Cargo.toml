[workspace]
resolver = "2"
members = ["crates/*/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/x7c1/coffret"

[workspace.dependencies]
# Internal crates
coffret-server = { path = "crates/apps/coffret-server" }

# Shared third-party dependencies
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
image = "0.25"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
walkdir = "2"
