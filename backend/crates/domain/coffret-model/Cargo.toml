[package]
name = "coffret-model"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Two dependencies and nothing else. `make check` enforces the list with
# `cargo tree -p coffret-model`, so anything added here has to be argued for
# there too.
[dependencies]
# The Unicode composition tables, which is what lets NFC be an invariant of
# `EntryPath` rather than a convention every construction site has to keep
# (spec: EP-1). They are data no codebase should carry a hand-written version
# of.
unicode-normalization = { workspace = true }
# Wiping key material as it is dropped (spec: DK-7). A hand-written loop over
# the bytes is dead code an optimizer may delete, so the guarantee this crate's
# secret-bearing types make cannot be kept without the volatile write nothing in
# the standard library offers.
zeroize = { workspace = true }
