[package]
name = "coffret-usecase"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The backend-agnostic contract suites — `conformance` for `ObjectStore`,
# `index_conformance` for `Index`, `spool_conformance` for the `Spool` over
# this device's own disk, `mapped_roots_conformance` for the `MappedRoots`
# beside it, `destinations_conformance` for the `Destinations` a fetch places
# through, `commit_conformance` for the commit flow over `ObjectStore` and
# `Index`, `sync_conformance` for the folder sync over those two plus the
# mapped folders, `freeze_conformance` for packing those folders into Packs
# instead, and `fetch_conformance` for the journey back — together with the
# `InMemoryStore`, `InMemoryIndex`, and `InMemoryFs` they run against, and the
# `InMemoryMintingStore` the `ObjectStore`, commit, and sync suites run against
# once more. Off by default: only a gateway's test target needs them, and a
# shipping binary should not carry the contract tests of the ports and
# capabilities it uses.
conformance = []
# `RewrittenReplicas::assembled`, for a shell's cases that say what a run's
# Keyring repairs print as: a repair is otherwise only ever made by a commit's
# examination. Turned on by `coffret-device`'s feature of the same name, which
# only `coffret-cli`'s `[dev-dependencies]` turn on, so no normal build can
# report a repair no run performed.
assembled-repairs = []

[dependencies]
# The commit flow writes and reads control objects, so it needs the byte forms
# FM-15, FM-16, FM-17 define. The dependency runs this way and only this way:
# the format layer turns domain values into bytes and knows nothing about where
# an object goes.
coffret-format = { workspace = true }
coffret-model = { workspace = true }

async-trait = { workspace = true }
# `join_all`, which a commit sends its Keyring replicas out with: no rule orders
# them, so they go to Storage at once and are read back at once (spec: KL-2,
# KL-14). `alloc` is the feature that carries it.
futures-util = { workspace = true, features = ["alloc"] }
# What both directions hash with: the plaintext of a local file, to tell a
# changed file from a touched one and to tell a fetched Entry from what the
# catalog names, and the ciphertext of a Container, which is the value FM-15
# records and what a fetch checks before unwrapping a key.
blake3 = { workspace = true }
# The jitter each backoff is drawn with, and the tail that keeps two fetches of
# one Container out of each other's scratch.
getrandom = { workspace = true }
# The one thing MD5 is for here: comparing an upload against the digest the
# provider reports for what it stored. It is never an integrity claim about
# content — that is BLAKE3, after decryption.
md-5 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# The marker the key bundles here state their drop-time wipe with: they hold
# purpose keys, each of which wipes itself, and the trait is what says so to a
# reader and to the assertions that pin the inventory (spec: DK-7).
zeroize = { workspace = true }

[dev-dependencies]
# Rewriting a Snapshot body into the schema-2 form an older build wrote, which
# no encoder in the workspace writes any more, for the catch-up cases that meet
# one (spec: FM-16).
ciborium = { workspace = true }

# The crate itself, with the contract suites turned on: an integration test
# cannot enable a feature of the crate it tests any other way, and the in-memory
# store and catalog the suites run against live behind the same feature.
coffret-usecase = { workspace = true, features = ["conformance"] }

# The capturing subscriber, for the cases that assert on what giving up
# recorded.
coffret-logging = { workspace = true, features = ["testing"] }

# `test-util` is what `#[tokio::test(start_paused = true)]` needs, and it is not
# part of `full`: without it the retry cases would wait out their own backoff in
# real time.
tokio = { workspace = true, features = ["test-util"] }

# Reading the registry of the names an operating system keeps (spec: EP-17),
# which the declarations in `system_files` are held to.
serde_json = { workspace = true }
