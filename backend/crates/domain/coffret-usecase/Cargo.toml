[package]
name = "coffret-usecase"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The backend-agnostic `ObjectStore` conformance suite. Off by default: only a
# gateway's test target needs it, and a shipping binary should not carry the
# contract tests of the port it uses.
conformance = []

[dependencies]
coffret-model = { workspace = true }

async-trait = { workspace = true }
# The jitter each backoff is drawn with.
getrandom = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The crate itself, with the contract suite turned on: an integration test
# cannot enable a feature of the crate it tests any other way, and the
# in-memory store the suite runs against lives behind the same feature.
coffret-usecase = { workspace = true, features = ["conformance"] }

# The capturing subscriber, for the cases that assert on what giving up
# recorded.
coffret-logging = { workspace = true, features = ["testing"] }

# `test-util` is what `#[tokio::test(start_paused = true)]` needs, and it is not
# part of `full`: without it the retry cases would wait out their own backoff in
# real time.
tokio = { workspace = true, features = ["test-util"] }
