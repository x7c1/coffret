[package]
name = "coffret-usecase"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The backend-agnostic contract suites — `conformance` for `ObjectStore`,
# `index_conformance` for `Index`, `commit_conformance` for the commit flow over
# both, `sync_conformance` for the folder sync over both plus a local folder,
# `freeze_conformance` for packing that folder into Packs instead, and
# `fetch_conformance` for the journey back — together with the `InMemoryStore`
# and `InMemoryIndex` they run against. Off by default: only a gateway's test
# target needs them, and a shipping binary should not carry the contract tests of
# the ports it uses.
conformance = []

[dependencies]
# The commit flow writes and reads control objects, so it needs the byte forms
# FM-15, FM-16, FM-17 define. The dependency runs this way and only this way:
# the format layer turns domain values into bytes and knows nothing about where
# an object goes.
coffret-format = { workspace = true }
coffret-model = { workspace = true }

async-trait = { workspace = true }
# What both directions hash with: the plaintext of a local file, to tell a
# changed file from a touched one and to tell a fetched Entry from what the
# catalog names, and the ciphertext of a Container, which is the value FM-15
# records and what a fetch checks before unwrapping a key.
blake3 = { workspace = true }
# The jitter each backoff is drawn with, and the tail that keeps two fetches of
# one Container out of each other's temporary file.
getrandom = { workspace = true }
# The one thing MD5 is for here: comparing an upload against the digest the
# provider reports for what it stored. It is never an integrity claim about
# content — that is BLAKE3, after decryption.
md-5 = { workspace = true }
# The `*at` syscalls a write into a mapped folder is confined with: the folder is
# reached by descending the Entry Path's components from the mapped root without
# following a symbolic link, and the temporary file, the rename, and the removal
# are then made against the folder that descent left open (spec: EP-4, EP-11).
rustix = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The crate itself, with the contract suites turned on: an integration test
# cannot enable a feature of the crate it tests any other way, and the in-memory
# store and catalog the suites run against live behind the same feature.
coffret-usecase = { workspace = true, features = ["conformance"] }

# The capturing subscriber, for the cases that assert on what giving up
# recorded.
coffret-logging = { workspace = true, features = ["testing"] }

# The folders and the spool directory a sync or a fetch case runs against, and
# the folder the crate's own unit tests walk. A suite does not make a case's
# directories itself — a backend hands them over, so that a run against a real
# provider keeps them wherever it wants.
tempfile = { workspace = true }

# `test-util` is what `#[tokio::test(start_paused = true)]` needs, and it is not
# part of `full`: without it the retry cases would wait out their own backoff in
# real time.
tokio = { workspace = true, features = ["test-util"] }
