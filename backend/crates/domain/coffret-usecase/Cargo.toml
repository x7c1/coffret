[package]
name = "coffret-usecase"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The backend-agnostic contract suites — `conformance` for `ObjectStore`,
# `index_conformance` for `Index`, and `commit_conformance` for the commit flow
# over both — together with the `InMemoryStore` and `InMemoryIndex` they run
# against. Off by default: only a gateway's test target needs them, and a
# shipping binary should not carry the contract tests of the ports it uses.
conformance = []

[dependencies]
# The commit flow writes and reads control objects, so it needs the byte forms
# FM-15 to FM-17 define. The dependency runs this way and only this way: the
# format layer turns domain values into bytes and knows nothing about where an
# object goes.
coffret-format = { workspace = true }
coffret-model = { workspace = true }

async-trait = { workspace = true }
# The jitter each backoff is drawn with.
getrandom = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The crate itself, with the contract suites turned on: an integration test
# cannot enable a feature of the crate it tests any other way, and the in-memory
# store and catalog the suites run against live behind the same feature.
coffret-usecase = { workspace = true, features = ["conformance"] }

# The capturing subscriber, for the cases that assert on what giving up
# recorded.
coffret-logging = { workspace = true, features = ["testing"] }

# `test-util` is what `#[tokio::test(start_paused = true)]` needs, and it is not
# part of `full`: without it the retry cases would wait out their own backoff in
# real time.
tokio = { workspace = true, features = ["test-util"] }
