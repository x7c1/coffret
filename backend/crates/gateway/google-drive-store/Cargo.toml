[package]
name = "google-drive-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
coffret-format = { workspace = true }
coffret-logging = { workspace = true }
coffret-model = { workspace = true }
coffret-usecase = { workspace = true }

async-trait = { workspace = true }
base64 = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
md-5 = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
# The capturing subscriber, for the cases that assert on what was emitted, and
# the file sink, so that a run of the conformance suite against a real account
# leaves the same record behind that a shipping binary would.
coffret-logging = { workspace = true, features = ["testing"] }
coffret-usecase = { workspace = true, features = ["conformance"] }

tempfile = { workspace = true }

# `test-util` is what `#[tokio::test(start_paused = true)]` needs, and it is not
# part of `full`: without it the cases that drive this gateway through a retry
# policy would wait out its backoff in real time.
tokio = { workspace = true, features = ["test-util"] }
