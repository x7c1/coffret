[package]
name = "s3-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
coffret-logging = { workspace = true }
coffret-model = { workspace = true }
coffret-usecase = { workspace = true }

async-trait = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
bytes = { workspace = true }
http-body = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The capturing subscriber, for the cases that assert on what was emitted.
coffret-logging = { workspace = true, features = ["testing"] }
coffret-usecase = { workspace = true, features = ["conformance"] }

aws-smithy-http-client = { workspace = true }
# The folder and the spool directory the sync suite runs against: a sync starts
# at a real filesystem whichever provider the Library is on.
tempfile = { workspace = true }
tokio = { workspace = true }
