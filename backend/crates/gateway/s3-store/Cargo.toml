[package]
name = "s3-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
coffret-logging = { workspace = true }
coffret-usecase = { workspace = true }

async-trait = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
bytes = { workspace = true }
http-body = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The capturing subscriber, for the cases that assert on what was emitted.
coffret-logging = { workspace = true, features = ["testing"] }
coffret-usecase = { workspace = true, features = ["conformance"] }

aws-smithy-http-client = { workspace = true }
# The folder the freeze and fetch suites place into: each ends in a fetch, and
# a fetch ends at a real filesystem whichever provider the Library is on. The
# sync suite needs none — its mapped folder and its spool are both in memory.
tempfile = { workspace = true }
tokio = { workspace = true }
