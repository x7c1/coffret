[package]
name = "coffret-local-fs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The capabilities this crate implements, and the vocabulary a refusal is
# reported in. It depends this way and only this way: the use-case layer names
# what it needs of the device's disk, and this crate is the one place the
# operating system is asked for it.
coffret-usecase = { workspace = true }
# The two times an Entry carries, which this crate reads off a filesystem's own
# metadata and hands back as the domain values (spec: FM-9).
coffret-model = { workspace = true }

async-trait = { workspace = true }
# Descriptor-relative syscalls confine reads and writes in a mapped folder:
# each folder is reached by descending from the mapped root without following a
# symbolic link; readers keep the final file open, and writers make, rename, and
# remove against the folder that descent left open (spec: EP-4, EP-8, EP-11).
rustix = { workspace = true }
# The filesystem calls themselves, on the runtime every flow above already runs
# on: a spool is written while a Container is being encoded and read while it is
# being uploaded, so neither may hold a worker thread against the disk.
tokio = { workspace = true }
# The two outcomes nothing above can see, because each is answered as a verdict
# rather than a refusal: a spool that was already gone when it was discarded
# (spec: OC-8), and a mapped root that was not there when it was stated
# (spec: EP-12).
tracing = { workspace = true }

[dev-dependencies]
# The three contract suites this gateway is held to, which the use-case crate
# owns, plus the in-memory store and catalog the confinement cases drive a whole
# fetch over: what those cases are about is a real filesystem under a mapped
# root, so the Library on the other side of them need not be real.
coffret-usecase = { workspace = true, features = ["conformance"] }
# The Master Key one epoch's keys are derived from, and the Entry Paths the
# confinement cases commit at.
coffret-model = { workspace = true }

# The directories the cases spool into, read from, and place into. Real ones,
# because what they are about is a real filesystem.
tempfile = { workspace = true }
tokio = { workspace = true }
