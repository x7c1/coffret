[package]
name = "coffret-device"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Above the gateways rather than beside them: this is the crate that picks one,
# which is exactly what a gateway may never do. `make deps` forbids a gateway
# depending on another gateway and says nothing about `apps/`, because composing
# them is what an application is for.
[dependencies]
coffret-format = { workspace = true }
# This device's own disk, behind the capabilities the use-case layer names. It
# is a gateway like the three below it: the flows say what they need of the
# local filesystem, and the crate that picks a provider picks this one too.
coffret-local-fs = { workspace = true }
coffret-model = { workspace = true }
coffret-sqlite-index = { workspace = true }
coffret-usecase = { workspace = true }
google-drive-store = { workspace = true }
s3-store = { workspace = true }

# The SDK's own credential and region resolution. A device settings file says
# where an S3 Library is and never how to sign for it, so the credentials come
# from the environment or a profile at the moment a store is built.
aws-config = { workspace = true }
aws-sdk-s3 = { workspace = true }

# The four random bytes that separate two batches started in the same second
# (spec: OC-2), and the thirty-two drawn for the key a server admits its
# callers by (spec: LA-3). Neither is Library key material: what a device calls
# its own unfinished batches never leaves it, and a server's key is spent when
# the server that drew it stops (spec: LA-4).
getrandom = { workspace = true }

# `flock`, for the one server at a time that serves a Library (spec: LA-8). The
# exclusion is the operating system's rather than a file this crate writes and
# believes, which is what makes a server that was killed leave nothing to be
# cleaned up by hand.
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# The date a batch id carries, so that a spool directory an interrupted run left
# says when it was made without anything having to be opened.
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
# The file sink, so that a run of the cases against a real S3 implementation
# leaves the same record behind that a shipping binary would. A library crate
# emits and never installs one. `testing` on top of that for the capturing
# subscriber: the case over a cleanup refusal reads back what reached the event
# rather than asserting on the code that emitted it.
coffret-logging = { workspace = true, features = ["testing"] }

# The store and the catalog the browsing cases run against. Nothing browsing
# answers comes from Storage or from a file, so a case plants catalog rows and
# reads them back rather than building a Library.
coffret-usecase = { workspace = true, features = ["conformance"] }

# Restamping an Index file's schema version behind the gateway's own back, for
# the one case that has to start from a layout this build refuses.
rusqlite = { workspace = true }

# The state directory every case runs under, so nothing a case writes lands in
# the state directory of whoever started the run.
tempfile = { workspace = true }
tokio = { workspace = true }
