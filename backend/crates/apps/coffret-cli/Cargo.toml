[package]
name = "coffret-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The package is named after the crate and the binary after what a person types.
[[bin]]
name = "coffret"
path = "src/main.rs"

# `coffret-device` and nothing below it. Every flow this binary drives is a call
# on that crate, so the shell can be replaced — by the explorer, by anything —
# without a flow moving with it. Reaching past it for a gateway or a use case
# would put a decision in the shell that the explorer would then have to make
# again, and differently.
[dependencies]
coffret-device = { workspace = true }
coffret-logging = { workspace = true }
# How a coffret process starts, which is the same in both binaries.
coffret-shell = { workspace = true }

anyhow = { workspace = true }
clap = { workspace = true }
# The `--json` answer, serialized from types of this crate's own rather than
# derived on the device layer's, so that its shape is this binary's contract.
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The loopback bucket the cases that are not about S3 put their Libraries in,
# which the device crate keeps for its own cases and exposes to these behind a
# feature only a dev-dependency turns on — and, the same way, findings put
# together by hand, for the cases that say what a run's findings print and exit
# with, and Keyring repairs put together the same way, for the cases that say
# what a failed run's repairs print as.
coffret-device = { workspace = true, features = ["stub-bucket", "assembled-findings", "assembled-repairs"] }

# The harness's own client, for the one thing a case cannot ask the binary: what
# is really in the bucket. Never what is under test — the binary resolves its own
# credentials and builds its own client, which is the point of the round trip.
aws-config = { workspace = true }
aws-sdk-s3 = { workspace = true }

# The state directory the cases run the built binary against, so nothing a case
# does reaches the state directory of whoever started the run.
tempfile = { workspace = true }
