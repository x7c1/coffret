[package]
name = "coffret-desktop"
description = "Coffret's desktop app: starts the server in-process and opens the explorer in the system browser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Compile the explorer's build output into the app, through the host's feature
# of the same name. A feature of this crate rather than one it always turns on,
# because features unify across a workspace build: asking for the host's
# `embed-web` unconditionally here would turn it on for every `cargo build` of
# the workspace — `make check` and CI's included — and fail every one of them
# that runs before `make web-dist` has written the page. `make desktop-build`
# and `make desktop-dev-build` build the page and then turn this on; a plain
# build answers a page saying the explorer is not in this binary.
embed-web = ["coffret-explorer-host/embed-web"]

[build-dependencies]
tauri-build = { workspace = true }

# A shell over the same three crates the other shells are, and nothing below
# them: `make deps` holds this crate to that boundary. The server's `launch`
# opens the Library and binds its socket exactly as the command line's server
# does, and the host serves the explorer in front of it exactly as it would in
# front of that one.
[dependencies]
# What this app shares with the other desktop shell: which build it is, the
# idle interval read from the environment, the type the typed Passphrase
# becomes before anything else touches it (spec: DK-7), and what a refusal
# tells the person and the log.
coffret-desktop-core = { workspace = true }
# Which Libraries are on this device, for the Passphrase window's list, and
# opening one again for an unlock in place.
coffret-device = { workspace = true }
coffret-explorer-host = { workspace = true }
coffret-server = { workspace = true }
# Where this process's log goes, the same as every other binary's.
coffret-shell = { workspace = true }

anyhow = { workspace = true }
# The Library names handed to the Passphrase window, as a script literal.
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
# The runtime the server and the host run on, owned by the app for its whole
# life rather than borrowed from Tauri's.
tokio = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
glib = { workspace = true }

[dev-dependencies]
# The explorer's host driven as the service it is, for the cases that hold the
# app's launch files to what the host does with the tickets in them.
axum = { workspace = true }
# The app's events read back as the log file would hold them, for the case that
# holds them to what an event may carry (spec: EL-1).
coffret-logging = { workspace = true, features = ["testing"] }
# A launch directory of the case's own.
tempfile = { workspace = true }
tower = { workspace = true }
