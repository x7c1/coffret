[package]
name = "coffret-measure"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
# The filter the server runs: its matching of a name and its choice of the most
# recent books are what is timed, over rows read here rather than through the
# Index port.
coffret-model = { workspace = true }
coffret-usecase = { workspace = true }
# The Index file itself, opened read-only: the harness reads the rows the
# server reads and must never be able to write one.
rusqlite = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
