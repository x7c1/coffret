[package]
name = "coffret-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# What every binary over `coffret-device` does before it does anything else, and
# nothing else. It sits beside that crate rather than under it because it
# installs a log sink and reads a terminal, neither of which a library may do —
# and above the domain for the same reason the two binaries are: it composes.
[dependencies]
coffret-device = { workspace = true }
coffret-logging = { workspace = true }

anyhow = { workspace = true }
rpassword = { workspace = true }

# The `Zeroize` trait alone: what wipes the bytes a Recovery Code that failed to
# decode leaves behind. Not the buffer such a code travels in — that is
# `Zeroizing`, and it is named through `coffret-device`, whose own signature put
# it there. A shell should not have to reach past the crate it calls to spell a
# type that crate asked it for.
zeroize = { workspace = true }
