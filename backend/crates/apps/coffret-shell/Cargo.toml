[package]
name = "coffret-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# What every binary over `coffret-device` does before it does anything else, and
# nothing else. It sits beside that crate rather than under it because it
# installs a log sink and reads a terminal, neither of which a library may do —
# and above the domain for the same reason the two binaries are: it composes.
[dependencies]
coffret-device = { workspace = true }
coffret-logging = { workspace = true }

# No `zeroize` here: what `rpassword` and the standard library answer a read
# with is a `String`, and every one of them becomes the `Passphrase` that wipes
# it rather than being copied into one, so this crate has no buffer of its own
# to overwrite (spec: DK-7).
anyhow = { workspace = true }
rpassword = { workspace = true }
