name: Release

# Tags a release and publishes it once the release PR has merged and CI is
# green on that commit, through colophon's reusable workflows, then attaches
# the desktop bundles. See docs/guides/release.md.

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

jobs:
  # Whether the commit CI judged is the squash of a merged PR labelled
  # `release`, and which version its title names. Only a green CI run started
  # by a push to this repository's main is considered.
  plan:
    permissions:
      contents: read
      pull-requests: read
    uses: x7c1/colophon/.github/workflows/release-plan.yml@a4d0af8d30a36d9978d393e28b540bdb3c641c6f # v0.3.0
    with:
      version-scheme: semver

  # Tags the commit CI judged and publishes the GitHub Release with the summary
  # written in the release PR. No assets: the bundles are attached afterwards.
  publish:
    needs: plan
    if: needs.plan.outputs.released == 'true'
    permissions:
      contents: write
      pull-requests: write
    uses: x7c1/colophon/.github/workflows/release-publish.yml@a4d0af8d30a36d9978d393e28b540bdb3c641c6f # v0.3.0
    with:
      tag: ${{ needs.plan.outputs.tag }}
      sha: ${{ needs.plan.outputs.sha }}
      pr-number: ${{ needs.plan.outputs.pr-number }}

  # Runs after the Release exists, so a bundle failure never blocks the tag:
  # it shows up as a failed run of this job to re-run (docs/guides/release.md,
  # "Desktop bundles").
  bundles:
    needs: [plan, publish]
    if: needs.plan.outputs.released == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/bundle.yml
    with:
      ref: ${{ needs.plan.outputs.tag }}
      release_tag: ${{ needs.plan.outputs.tag }}
