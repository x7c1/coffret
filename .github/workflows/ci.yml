name: CI

on:
  pull_request:
    branches: [main, 'feat/**']
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # No toolchain is named here on purpose. rust-toolchain.toml decides,
      # so this job runs the same compiler a developer's checkout does, and a
      # new release cannot change what CI enforces without that file moving.
      # `rustup show` is what makes rustup install it, and prints it into the
      # log so the run says which compiler judged it.
      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # In this job rather than its own, because it needs the same toolchain and
      # the same warmed target directory the four steps above already built —
      # rustdoc reuses their check artifacts, so it costs seconds here and a
      # cold compile anywhere else.
      #
      # The command is the one `make check` runs; see the comment there for what
      # RUSTDOCFLAGS and `--no-deps` buy, and why it is not
      # `--document-private-items`.
      - name: Docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace

  # What this asks of the dependency tree, and the reason behind every
  # allowance, is in backend/deny.toml.
  #
  # Its own job rather than a step in `backend`, because it compiles none of the
  # workspace — it answers from Cargo.lock and a fetched advisory database — and
  # so has no reason to queue behind something that does. It is also the one job
  # here that can turn red with this repository unchanged, when an advisory is
  # published against something already in the tree, and that deserves to be
  # legible as itself rather than as "the backend job failed".
  #
  # A job that runs is not yet a job that blocks: a new one stops a merge only
  # once it is listed in this repository's required checks, which is a setting
  # and not a file in this tree. Until it is listed, this reports and nothing
  # waits for it — the failure mode it was added to remove.
  cargo-deny:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # One place to bump the tool, shared by the cache key and the install.
      CARGO_DENY_VERSION: 0.20.2
    steps:
      - uses: actions/checkout@v4

      # See the backend job: rust-toolchain.toml names the compiler.
      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo-deny
        id: cache-cargo-deny
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-deny-${{ env.CARGO_DENY_VERSION }}

      # Built from source rather than taken from a third-party action. This is
      # the job that guards the supply chain of a product whose whole claim is
      # that it holds other people's files under encryption, and reaching for
      # somebody's action would add a party to the chain being checked in order
      # to check it. `cargo install` reaches only crates.io, which this workspace
      # already trusts with everything it compiles; `--version` pins the tool so
      # that a release cannot change what CI enforces, and `--locked` pins what
      # the tool itself is built from. It takes about a minute, and only on a
      # cache miss.
      - name: Install cargo-deny
        if: steps.cache-cargo-deny.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"

      # `--locked` because this job answers from Cargo.lock without compiling
      # anything: without it, a lockfile a manifest edit has outgrown is
      # rewritten in passing, and the tree that gets checked is not the one
      # under review. `make deny` runs the same command.
      - name: Advisories, bans, licenses and sources
        run: cargo deny --locked check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Single source of truth: the pnpm version comes from the
          # "packageManager" field in frontend/package.json. Do not also set
          # "version" here or action-setup errors on the conflict.
          package_json_file: frontend/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Lint
        run: pnpm -r lint

  # Each implementation opens what the other encrypted, by exchanging fixture
  # sets. It runs on every change because the two are independent: a change to
  # either one can only be shown not to break the other by running both.
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # See the backend job: rust-toolchain.toml names the compiler.
      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-interop-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-interop-

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # See the frontend job: the pnpm version comes from
          # frontend/package.json and must not be repeated here.
          package_json_file: frontend/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Exchange fixtures
        run: make interop

  # The ObjectStore contract, against a server that really evaluates it. A mock
  # would agree with whatever the adapter believes; MinIO decides for itself
  # whether a conditional PUT wins, what a continuation token means, and what an
  # ETag is. It runs on every change because the contract is what the second
  # adapter is held to as well.
  s3-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # See the backend job: rust-toolchain.toml names the compiler.
      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-s3-store-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-s3-store-

      - name: Conformance suite against MinIO
        run: make s3-store-it

  # The explorer's four journeys, through a real browser against real processes:
  # a coffret-server holding a Library on MinIO, an Index on disk, and a sync
  # running beside it. It needs both toolchains, because a journey starts at the
  # command line — a Library created, a second device joined to it — and ends in
  # Chromium.
  #
  # The screenshots are kept whatever the run did. What a machine cannot judge is
  # whether the screen reads right, and the pictures of a run that failed are the
  # ones most worth looking at.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # See the backend job: rust-toolchain.toml names the compiler.
      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # See the frontend job: the pnpm version comes from
          # frontend/package.json and must not be repeated here.
          package_json_file: frontend/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      # Chromium itself is downloaded by the target, which installs it
      # idempotently and with the system packages a headless browser needs on a
      # runner.
      - name: Journeys against MinIO
        run: make e2e-it

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: .tmp/e2e/screenshots/
          if-no-files-found: warn
