name: CI

on:
  pull_request:
    branches: [main, 'feat/**']
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    # Each job is bounded at a few times its usual duration, so a stalled
    # step fails the run instead of holding it until GitHub's six-hour limit.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    # No apt step: every crate in the workspace builds from what the runner
    # image and the Rust toolchain carry.
    steps:
      - uses: actions/checkout@v4

      # No toolchain is named here on purpose. rust-toolchain.toml decides,
      # so this job runs the same compiler a developer's checkout does, and a
      # new release cannot change what CI enforces without that file moving.
      # `rustup show` is what makes rustup install it, and prints it into the
      # log so the run says which compiler judged it.
      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          # `-backend-`, so that the restore key below cannot match the other
          # jobs' keys, which share the `-cargo-` prefix.
          key: ${{ runner.os }}-cargo-backend-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-backend-

      # A restored target may hold builds of this workspace newer than the
      # checkout; scripts/forget-workspace-builds.sh says why that matters.
      - name: Rebuild the workspace's own crates
        working-directory: .
        run: scripts/forget-workspace-builds.sh backend

      - name: Format
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The build clippy's `--all-targets` does not make: default features and
      # default targets, without the features the tests' dev-dependencies turn
      # on, so a failure or a warning only that build raises stops the job. The
      # command is the one `make check` runs; see the comment there for why.
      - name: Default build, warnings denied
        run: RUSTFLAGS="-D warnings" cargo check --locked --workspace --target-dir target/default-check

      # In this job rather than its own, because it needs the same toolchain and
      # the same warmed target directory the build, test and clippy steps above
      # already built — rustdoc reuses their check artifacts, so it costs
      # seconds here and a cold compile anywhere else.
      #
      # The command is the one `make check` runs; see the comment there for what
      # RUSTDOCFLAGS and `--no-deps` buy, and why it is not
      # `--document-private-items`.
      - name: Docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace

  # What this asks of the dependency tree, and the reason behind every
  # allowance, is in backend/deny.toml.
  #
  # Its own job rather than a step in `backend`, because it compiles none of the
  # workspace — it answers from Cargo.lock and a fetched advisory database — and
  # so has no reason to queue behind something that does. It is also the one job
  # here that can turn red with this repository unchanged, when an advisory is
  # published against something already in the tree, and that deserves to be
  # legible as itself rather than as "the backend job failed".
  #
  # A job that runs is not yet a job that blocks: a new one stops a merge only
  # once it is listed in this repository's required checks, which is a setting
  # and not a file in this tree. Until it is listed, this reports and nothing
  # waits for it — the failure mode it was added to remove.
  cargo-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      # One place to bump the tool, shared by the cache key and the install.
      CARGO_DENY_VERSION: 0.20.2
    steps:
      - uses: actions/checkout@v4

      # See the backend job: rust-toolchain.toml names the compiler.
      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo-deny
        id: cache-cargo-deny
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-deny-${{ env.CARGO_DENY_VERSION }}

      # Built from source rather than taken from a third-party action. This is
      # the job that guards the supply chain of a product whose whole claim is
      # that it holds other people's files under encryption, and reaching for
      # somebody's action would add a party to the chain being checked in order
      # to check it. `cargo install` reaches only crates.io, which this workspace
      # already trusts with everything it compiles; `--version` pins the tool so
      # that a release cannot change what CI enforces, and `--locked` pins what
      # the tool itself is built from. It takes about a minute, and only on a
      # cache miss.
      - name: Install cargo-deny
        if: steps.cache-cargo-deny.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"

      # `--locked` because this job answers from Cargo.lock without compiling
      # anything: without it, a lockfile a manifest edit has outgrown is
      # rewritten in passing, and the tree that gets checked is not the one
      # under review. `make deny` runs the same command.
      - name: Advisories, bans, licenses and sources
        run: cargo deny --locked check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    # No job but `e2e` runs Electron (a dependency of
    # frontend/packages/apps/desktop), so every other job that installs the
    # frontend says not to fetch its binary; a job added later that installs
    # it says the same. The Electron version the lockfile pins fetches its
    # binary on first run rather than at install, so today this guards against
    # a version that fetches it at install again.
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Single source of truth: the pnpm version comes from the
          # "packageManager" field in frontend/package.json. Do not also set
          # "version" here or action-setup errors on the conflict.
          package_json_file: frontend/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Lint
        run: pnpm -r lint

      # Every package in pnpm-lock.yaml against the advisories the npm registry
      # publishes, development and test dependencies included: none of those
      # ships in the explorer, but the toolchain runs on the same device as a
      # person's Libraries. An advisory no update clears is allowed in
      # frontend/pnpm-workspace.yaml, with its reason beside it, and not here.
      #
      # This is the one step in the job that can turn red with this repository
      # unchanged, when an advisory is published against something already in
      # the lockfile. It runs last so that such a day still says whether the
      # frontend builds, typechecks, tests and lints. Without
      # `--ignore-registry-errors`: a registry that cannot be asked is a run that
      # did not check, and passing it would be the silence this step exists to
      # remove. `make audit` runs the same command.
      - name: Audit
        run: pnpm audit

  # The checks `make check` runs on how the spec is cited rather than on the
  # code: a rule is cited with the `spec:` prefix outside the register, every
  # cited rule has exactly one home, and that second check still refuses what it
  # exists to refuse. They need git and a shell and nothing else, so they run on
  # their own instead of waiting on a toolchain. The field-number registry guard
  # sits beside them for the same reason, needing jq beyond those, which the
  # runner carries: an edit to docs/spec/format/field-numbers.json may add rows
  # and retire them, never change one main already holds.
  #
  # The shell scripts' lint and format check runs here for the same reason,
  # needing curl beyond those: it fetches the shellcheck and shfmt that
  # scripts/shell-lint.sh pins rather than using the runner's, and that script's
  # header says why. The release scripts' unit test, which needs only bash,
  # runs beside it, and so does the test of how the release workflow reads the
  # workspace version, which needs cargo metadata and jq, both on the runner.
  spec:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The field-number registry guard compares the registry with its
          # version on the merge base with origin/main, which a shallow clone
          # lacks.
          fetch-depth: 0

      - name: Spec citations and rule homes
        run: make spec-citations spec-rule-ids spec-rule-ids-test

      - name: Field-number registry guard
        run: make field-numbers-guard field-numbers-guard-test

      - name: Shell scripts, shellcheck and shfmt
        run: make shell-lint

      # The release PR's summary handling (docs/guides/release.md), offline.
      - name: Release summary tests
        run: bash .github/scripts/release-summary.test.sh

      # The workspace version the release workflow reads, and whether it went
      # up (docs/guides/release.md).
      - name: Version change test
        run: make check-version-change-test

      # The check the development app makes before it starts, over throwaway
      # stand-ins for /proc and /etc/apparmor.d (docs/guides/environments.md).
      - name: Development app sandbox check test
        run: make desktop-dev-sandbox-test

  # Each implementation opens what the other encrypted, by exchanging fixture
  # sets. It runs on every change because the two are independent: a change to
  # either one can only be shown not to break the other by running both.
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # See the frontend job: nothing here runs Electron.
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      # See the backend job: rust-toolchain.toml names the compiler.
      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-interop-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-interop-

      # A restored target may hold builds of this workspace newer than the
      # checkout; scripts/forget-workspace-builds.sh says why that matters.
      - name: Rebuild the workspace's own crates
        working-directory: .
        run: scripts/forget-workspace-builds.sh backend

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # See the frontend job: the pnpm version comes from
          # frontend/package.json and must not be repeated here.
          package_json_file: frontend/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Exchange fixtures
        run: make interop

  # The ObjectStore contract, against a server that really evaluates it. A mock
  # would agree with whatever the adapter believes; MinIO decides for itself
  # whether a conditional PUT wins, what a continuation token means, and what an
  # ETag is. It runs on every change because the contract is what the second
  # adapter is held to as well.
  s3-store:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # See the backend job: rust-toolchain.toml names the compiler.
      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-s3-store-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-s3-store-

      - name: Conformance suite against MinIO
        run: make s3-store-it

  # The explorer's four journeys, through a real browser against real processes:
  # a coffret-server holding a Library on MinIO, an Index on disk, and a sync
  # running beside it. It needs both toolchains, because a journey starts at the
  # command line — a Library created, a second device joined to it — and ends in
  # Chromium.
  #
  # Then the desktop app's journey, in the Electron app itself, against MinIO
  # too: the one job that runs Electron, so the one that lets `pnpm install`
  # and the app fetch its binary (see the frontend job). It runs under
  # xvfb-run, since the runner has no display.
  #
  # The screenshots are kept whatever the run did. What a machine cannot judge is
  # whether the screen reads right, and the pictures of a run that failed are the
  # ones most worth looking at.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      # See the backend job: rust-toolchain.toml names the compiler.
      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-

      # A restored target may hold builds of this workspace newer than the
      # checkout; scripts/forget-workspace-builds.sh says why that matters. Here
      # it would put a Node-API addon built from another commit into the
      # desktop app's journey.
      - name: Rebuild the workspace's own crates
        run: scripts/forget-workspace-builds.sh backend

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # See the frontend job: the pnpm version comes from
          # frontend/package.json and must not be repeated here.
          package_json_file: frontend/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      # The version the lockfile resolved, which is what names the browser build
      # Playwright downloads: a cache keyed on anything else would either keep a
      # Chromium the installed Playwright no longer drives, or miss on every run.
      - name: Playwright version
        id: playwright
        working-directory: frontend/packages/apps/e2e
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright's browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      # Every apt fetch gives up on a silent connection after 30 seconds and
      # tries again, up to three times, so a stalled mirror costs this job a
      # couple of minutes rather than the whole of the step's timeout. Written
      # under apt.conf.d rather than passed as `-o` options so that it also
      # reaches the apt runs `playwright install-deps` makes. Before the step
      # below, which is this job's only apt run.
      - name: Bound apt's waits on the mirror
        run: |
          printf '%s\n' \
            'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' \
            'Acquire::Retries "3";' \
            | sudo tee /etc/apt/apt.conf.d/80-stall-timeout

      # The system packages a headless Chromium needs on a runner, installed by
      # apt. A step of its own, not part of the target, so that a stalled mirror
      # fails here under its own bound instead of holding the journeys' step
      # until the job is cancelled. A working run takes under a minute; the
      # bound leaves room for a stall the retries get past.
      - name: Install Chromium's system packages
        timeout-minutes: 5
        working-directory: frontend/packages/apps/e2e
        run: pnpm exec playwright install-deps chromium

      # Chromium itself is installed by the target, idempotently; its system
      # packages come from the step above. On a cache hit the browser is already
      # where Playwright looks and nothing is downloaded; the download happens
      # once per Playwright version.
      - name: Journeys against MinIO
        run: make e2e-it

      # The Electron app on a virtual display. Its system packages are among
      # Chromium's, which the step above installed, xvfb included.
      - name: The desktop app's journey against MinIO
        run: xvfb-run --auto-servernum make e2e-electron

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            .tmp/e2e/screenshots/
            .tmp/e2e-electron/screenshots/
          if-no-files-found: warn

      # What a failed run is read from afterwards, beyond the pictures: the
      # traces Playwright retains for a failed journey, the logs of every
      # process the run started, the whole transcript, and the one command that
      # was running when it stopped. Only on failure, since a passing run has
      # nothing in them anybody reads. Nothing here is a secret worth keeping:
      # the credentials and the Passphrase are the script's own, and the Library
      # — with the Recovery Code the transcript prints for it — is generated and
      # thrown away.
      - name: Keep the traces and logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            .tmp/e2e/playwright/
            .tmp/e2e/logs/
            .tmp/e2e/transcript.log
            .tmp/e2e/last-command.log
            .tmp/e2e-electron/playwright/
            .tmp/e2e-electron/logs/
          if-no-files-found: warn
