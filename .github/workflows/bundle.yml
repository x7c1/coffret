name: Bundle

# Builds the unsigned desktop bundles of the Tauri shell
# (backend/crates/apps/coffret-desktop). Called by the Release workflow with a
# release tag, it attaches them to that Release; on pull requests and manual
# runs it uploads them as workflow artifacts. See docs/guides/release.md
# ("Desktop bundles").

on:
  workflow_call:
    inputs:
      ref:
        description: The ref (tag) to build.
        type: string
        required: true
      release_tag:
        description: The tag of an existing GitHub Release to attach the bundles to.
        type: string
        default: ''
  pull_request:
    branches: [main, 'feat/**']
    # Only what decides how the bundle is made. A change to the explorer or
    # the server is built and tested by CI, and the Release workflow bundles
    # everything on the way to a release; a tauri bump lands in the lockfile.
    paths:
      - backend/crates/apps/coffret-desktop/**
      - backend/Cargo.lock
      - scripts/desktop.sh
      - .github/workflows/bundle.yml
  workflow_dispatch:
    inputs:
      ref:
        description: The ref (branch, tag or SHA) to build.
        type: string
        required: true

jobs:
  bundle:
    name: bundle (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      # The system libraries the shell (Tauri v2: WebKitGTK 4.1, GTK 3, the
      # app-indicator and SVG libraries) links against on Linux — the list the
      # backend job in ci.yml installs. Also part of their cache key.
      APT_PACKAGES: >-
        libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
        librsvg2-dev libxdo-dev libssl-dev patchelf
      # Pinned so that a release of the CLI cannot change the bundles under an
      # unchanged tree, as with cargo-deny in ci.yml. Its major version is the
      # one `make desktop-build` asks for.
      TAURI_CLI_VERSION: 2.12.0
      # Where `cargo tauri build` writes, per bundle type, without --target.
      BUNDLE_DIR: backend/target/release/bundle
      # The bundles, gathered for the upload.
      OUT_DIR: ${{ github.workspace }}/.tmp/bundles

    # Uploading to a Release needs write access. A called workflow cannot hold
    # more than its caller grants, and a pull_request token from a fork stays
    # read-only regardless.
    permissions:
      contents: write

    strategy:
      # One broken platform must not hide whether the others still bundle.
      fail-fast: false
      matrix:
        include:
          # Apple silicon only: Intel Macs are not supported. The runner is
          # arm64, so the build is native and needs no --target.
          - name: macos-aarch64
            runner: macos-14
            # Coffret_<version>_aarch64.dmg
            bundles: dmg
          # The deb's name follows tauri.linux.conf.json's productName:
          # coffret-desktop_<version>_amd64.deb
          - name: linux-x86_64
            runner: ubuntu-22.04
            bundles: deb

    steps:
      # The pull_request run builds the event's merge ref; the other two build
      # the ref they were given.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # The apt archive cache, as in ci.yml's backend job (see the comment there).
      - name: Prepare the apt archive cache
        if: runner.os == 'Linux'
        id: apt-cache-key
        run: |
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          sudo chown "$(id -u):$(id -g)" /var/cache/apt/archives
          packages_hash=$(printf '%s' "$APT_PACKAGES" | sha256sum | cut -c1-16)
          prefix="apt-${{ runner.os }}-${ImageOS}-${packages_hash}-"
          echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Cache apt archives
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives/*.deb
          key: ${{ steps.apt-cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.apt-cache-key.outputs.prefix }}

      # A stalled mirror can hang `apt-get update`; fail fast instead of
      # waiting out the job. A working run takes 1 to 8 minutes.
      - name: Install system packages
        timeout-minutes: 15
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y -o APT::Keep-Downloaded-Packages=true $APT_PACKAGES
          sudo apt-get autoclean
          sudo find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec chmod a+r {} +

      # rust-toolchain.toml names the toolchain; `rustup show` installs it, as
      # in ci.yml.
      - name: Install Rust toolchain
        run: rustup show

      # Keyed apart from ci.yml's: the release profile differs from its debug
      # builds, so sharing its cache would only evict it.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-bundle-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-bundle-

      - name: Cache the Tauri CLI
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: ${{ runner.os }}-tauri-cli-${{ env.TAURI_CLI_VERSION }}

      # From crates.io rather than through Tauri's GitHub Action: this
      # repository avoids a third-party action where a command does the job,
      # for the reason the cargo-deny job in ci.yml gives.
      - name: Install the Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --locked --version "$TAURI_CLI_VERSION"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      # The shell compiles the explorer's build output in through its
      # `embed-web` feature, so the explorer is built first, as
      # `make desktop-build` does.
      - name: Build the explorer
        run: make web-dist

      # The build scripts/desktop.sh's `build` makes. TAURI_CONFIG is never
      # set here: that override is how the development app
      # (io.github.x7c1.coffret.dev) is made, and a release is the installed
      # app, which carries tauri.conf.json's identifier
      # (io.github.x7c1.coffret). The bundle directory is emptied first, since
      # backend/target is restored from a cache that may hold the bundles of
      # an earlier version.
      - name: Build the bundles
        env:
          BUNDLES: ${{ matrix.bundles }}
        run: |
          rm -rf "$BUNDLE_DIR"
          cd backend/crates/apps/coffret-desktop
          cargo tauri build --features embed-web --bundles "$BUNDLES"

      # Each bundle type is written to a directory of its name, as a file
      # with its name as the extension.
      - name: Gather the bundles
        env:
          BUNDLES: ${{ matrix.bundles }}
        run: |
          shopt -s nullglob
          files=("$BUNDLE_DIR/$BUNDLES"/*."$BUNDLES")
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::Expected one .${BUNDLES} under ${BUNDLE_DIR}/${BUNDLES}, found ${#files[@]}: ${files[*]}"
            exit 1
          fi
          mkdir -p "$OUT_DIR"
          cp "${files[0]}" "$OUT_DIR/"
          ls -l "$OUT_DIR"

      - name: Attach the bundles to the Release
        if: ${{ inputs.release_tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        # --clobber, so re-running a failed job replaces what it uploaded.
        run: gh release upload "$RELEASE_TAG" "$OUT_DIR"/* --clobber

      - name: Upload the bundles
        if: ${{ !inputs.release_tag }}
        uses: actions/upload-artifact@v4
        with:
          name: coffret-${{ matrix.name }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
