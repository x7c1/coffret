name: Bundle

# Builds the desktop bundles of the Electron app
# (frontend/packages/apps/desktop) — an ad hoc signed .dmg for macOS and a .deb
# for Linux — and checks each against its packaging config. Called by the
# Release workflow with a release tag, it attaches them to that Release; on
# pull requests and manual runs it uploads them as workflow artifacts. See
# docs/guides/release.md ("Desktop bundles").

on:
  workflow_call:
    inputs:
      ref:
        description: The ref (tag) to build.
        type: string
        required: true
      release_tag:
        description: The tag of an existing GitHub Release to attach the bundles to.
        type: string
        default: ''
  pull_request:
    branches: [main, 'feat/**']
    # Only what decides how the bundle is made: the app's package and its
    # packaging config, the addon it runs the server in and the crates that
    # make that addon, the lockfiles, and the scripts that build and check it.
    # A change to the explorer or the server is built and tested by CI, and the
    # Release workflow bundles everything on the way to a release.
    paths:
      - frontend/packages/apps/desktop/**
      - frontend/pnpm-lock.yaml
      - frontend/pnpm-workspace.yaml
      - backend/crates/apps/coffret-napi/**
      - backend/crates/apps/coffret-desktop-core/**
      - backend/Cargo.lock
      - Makefile
      - scripts/desktop.sh
      - scripts/check-desktop-bundle.sh
      - scripts/workspace-version.sh
      - .github/workflows/bundle.yml
  workflow_dispatch:
    inputs:
      ref:
        description: The ref (branch, tag or SHA) to build.
        type: string
        required: true

jobs:
  bundle:
    name: bundle (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      # Where electron-builder writes the bundle (electron-builder.config.js).
      RELEASE_DIR: frontend/packages/apps/desktop/release
      # The bundles, gathered for the upload.
      OUT_DIR: ${{ github.workspace }}/.tmp/bundles

    # Uploading to a Release needs write access. A called workflow cannot hold
    # more than its caller grants, and a pull_request token from a fork stays
    # read-only regardless.
    permissions:
      contents: write

    strategy:
      # One broken platform must not hide whether the others still bundle.
      fail-fast: false
      matrix:
        include:
          # Apple silicon only: Intel Macs are not supported. The runner is
          # arm64, so the build is native.
          - name: macos-aarch64
            runner: macos-14
            # Coffret_<version>_aarch64.dmg
            bundle: dmg
          # coffret-desktop_<version>_amd64.deb. On 22.04, the oldest Ubuntu
          # the .deb is installed on, so that the addon asks for no newer
          # glibc than that has.
          - name: linux-x86_64
            runner: ubuntu-22.04
            bundle: deb

    steps:
      # The pull_request run builds the event's merge ref; the other two build
      # the ref they were given.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # rust-toolchain.toml names the toolchain; `rustup show` installs it, as
      # in ci.yml.
      - name: Install Rust toolchain
        run: rustup show

      # Keyed apart from ci.yml's: the release profile differs from its debug
      # builds, so sharing its cache would only evict it.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-bundle-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-bundle-

      # A restored target may hold builds of this workspace newer than the
      # checkout; scripts/forget-workspace-builds.sh says why that matters.
      - name: Rebuild the workspace's own crates
        working-directory: .
        run: scripts/forget-workspace-builds.sh backend

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Unlike ci.yml, with Electron's binary: electron-builder packages it.
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      # What `make desktop-build` runs: the explorer, the addon with the
      # explorer compiled in (`make napi-addon`), the app's code, and the
      # bundle for this host, at the workspace version of backend/Cargo.toml.
      # It then checks the bundle against its packaging config
      # (scripts/check-desktop-bundle.sh; docs/guides/release.md lists what
      # is checked), and a failed check fails the step. The bundle is always
      # the installed app, identifier io.github.x7c1.coffret: the development
      # one is never packaged.
      # electron-builder skips code signing on a pull request's build unless
      # told otherwise, which would ship the macOS app without its ad hoc
      # signature and hardened runtime. The signature is ad hoc (identity `-`):
      # no certificate, key or secret is involved, so signing a pull request's
      # build exposes nothing.
      - name: Build and check the bundle
        env:
          CSC_FOR_PULL_REQUEST: 'true'
        run: scripts/desktop.sh build

      # The one bundle of this host's type, which `build` also insisted on.
      - name: Gather the bundle
        env:
          BUNDLE: ${{ matrix.bundle }}
        run: |
          shopt -s nullglob
          files=("$RELEASE_DIR"/*."$BUNDLE")
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::Expected one .${BUNDLE} under ${RELEASE_DIR}, found ${#files[@]}: ${files[*]}"
            exit 1
          fi
          mkdir -p "$OUT_DIR"
          cp "${files[0]}" "$OUT_DIR/"
          ls -l "$OUT_DIR"

      - name: Attach the bundles to the Release
        if: ${{ inputs.release_tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        # --clobber, so re-running a failed job replaces what it uploaded.
        run: gh release upload "$RELEASE_TAG" "$OUT_DIR"/* --clobber

      - name: Upload the bundles
        if: ${{ !inputs.release_tag }}
        uses: actions/upload-artifact@v4
        with:
          name: coffret-${{ matrix.name }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
